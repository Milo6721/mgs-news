<title>MGS Wiadomości</title>
<meta name="description" content="MGS Wiadomości – informacje z ekosystemu MGS Corporation: finanse, zdrowie, technologia, handel i logistyka.">
<meta name="theme-color" content="#0a1f44">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a1f44'/%3E%3Crect x='8' y='40' width='48' height='14' rx='3' fill='%23e5242b'/%3E%3Ctext x='32' y='34' font-family='Arial' font-weight='800' font-size='22' text-anchor='middle' fill='%23fff'%3EMGS%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#eef2f9;--text:#0f1d33;--muted:rgba(30,46,72,.64);--accent:#0b5fd1;--red:#e5242b;--glass:linear-gradient(145deg,rgba(255,255,255,.78),rgba(255,255,255,.4));--rim:rgba(255,255,255,.9);--shadow:0 16px 44px rgba(15,40,90,.14);--field:rgba(255,255,255,.65);--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050c1c;--text:#eaf0ff;--muted:rgba(212,224,250,.66);--accent:#5aa2ff;--glass:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));--rim:rgba(255,255,255,.2);--shadow:0 16px 44px rgba(0,0,0,.5);--field:rgba(255,255,255,.08);--card:#0d1a33}}
:root[data-theme=dark]{--bg:#050c1c;--text:#eaf0ff;--muted:rgba(212,224,250,.66);--accent:#5aa2ff;--glass:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));--rim:rgba(255,255,255,.2);--shadow:0 16px 44px rgba(0,0,0,.5);--field:rgba(255,255,255,.08);--card:#0d1a33}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.4}
.b1{width:520px;height:520px;background:#2f7bff;left:-160px;top:-140px;animation:f1 20s ease-in-out infinite}.b2{width:440px;height:440px;background:#e5242b;right:-160px;top:30%;opacity:.18;animation:f2 24s ease-in-out infinite}.b3{width:500px;height:500px;background:#1740a8;left:25%;bottom:-240px;animation:f1 28s ease-in-out infinite}
@keyframes f1{50%{transform:translate(60px,40px) scale(1.12)}}@keyframes f2{50%{transform:translate(-60px,50px) scale(1.15)}}
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);border-radius:26px;box-shadow:var(--shadow),inset 0 1px 0 var(--rim)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
#prog{position:fixed;left:0;top:0;height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--red),var(--accent));z-index:60}
.top{background:#0a1f44;color:#cfe0ff;font-size:12.5px}.top .wrap{display:flex;align-items:center;gap:14px;height:38px}
.live{flex:none;background:var(--red);color:#fff;font-weight:800;letter-spacing:.06em;padding:3px 10px;border-radius:6px;font-size:11.5px;animation:blink 2s infinite}@keyframes blink{50%{opacity:.7}}
.tick{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}.tick div{display:inline-block;padding-left:100%;animation:tk 48s linear infinite}.tick:hover div{animation-play-state:paused}.tick a{margin-right:46px}.tick a::before{content:"●";color:var(--red);margin-right:10px;font-size:9px}
@keyframes tk{to{transform:translateX(-100%)}}
.date{flex:none;opacity:.8}@media (max-width:640px){.date{display:none}}
header.h{position:sticky;top:8px;z-index:40;margin-top:10px}
.bar{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:999px}
.brand{display:flex;align-items:center;gap:10px;padding-right:6px}.brand img{height:46px;width:auto;border-radius:12px;display:block}
.cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}.cats::-webkit-scrollbar{display:none}
.cats a{padding:8px 13px;border-radius:999px;font-weight:650;font-size:14px;white-space:nowrap;transition:background .2s,color .2s}.cats a:hover{background:var(--field)}.cats a.on{background:var(--accent);color:#fff}
.ib{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--field);display:grid;place-items:center;font-size:17px;box-shadow:inset 0 1px 0 var(--rim);transition:transform .2s}.ib:hover{transform:scale(1.08)}
.sr{display:none;margin-top:10px}.sr.on{display:block;animation:rise .35s both}.sr input{width:100%;height:50px;border-radius:999px;border:0;padding:0 22px;background:var(--field);font:inherit;color:var(--text);outline:none;box-shadow:0 0 0 .5px var(--rim),var(--shadow)}.sr input:focus{box-shadow:0 0 0 3.5px rgba(11,95,209,.35)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--c,var(--accent))}
.cover{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));isolation:isolate}
.cover svg{position:absolute;right:-6%;bottom:-14%;width:62%;height:auto;opacity:.22;z-index:-1;transition:transform .6s}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.28),transparent 55%);z-index:-1}
.cover.frame iframe{position:absolute;left:0;top:0;border:0;width:1280px;height:800px;transform-origin:0 0;pointer-events:none;z-index:0}.cover.frame::after{display:none}.card:hover .cover svg{transform:scale(1.12) rotate(-4deg)}
.card{display:block;border-radius:26px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s}.card:hover{transform:translateY(-4px)}
.meta{color:var(--muted);font-size:13px}
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin:22px 0}@media (max-width:900px){.hero{grid-template-columns:1fr}}
.big{min-height:440px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding:30px;position:relative}
.big .cover{position:absolute;inset:0;z-index:0}.big>*:not(.cover){position:relative;z-index:1}
.big .pill{align-self:flex-start}.big h1{font-size:clamp(28px,4.6vw,46px);line-height:1.08;letter-spacing:-.025em;margin:12px 0}.big p{margin:0 0 12px;max-width:640px;opacity:.9;font-size:17px}.big .meta{color:rgba(255,255,255,.8)}
.big::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(5,12,30,.72),transparent 60%);z-index:0}
.side{display:grid;gap:14px;align-content:start}
.mini{display:flex;gap:14px;padding:12px;align-items:center}.mini .cover{flex:none;width:96px;height:96px;border-radius:18px}.mini h3{margin:6px 0 2px;font-size:16px;line-height:1.28}
.sec a.all{font-weight:650;color:var(--accent);font-size:14px;white-space:nowrap}.new{position:absolute;top:14px;left:14px;z-index:2;background:var(--red);color:#fff;font-weight:800;font-size:11.5px;letter-spacing:.08em;padding:4px 11px;border-radius:999px;box-shadow:0 6px 16px rgba(229,36,43,.45);animation:blink 2.4s infinite}.tagnew{align-self:flex-start;background:var(--red);color:#fff;font-weight:800;font-size:12px;letter-spacing:.08em;padding:5px 12px;border-radius:999px;margin-bottom:10px;animation:blink 2.4s infinite;box-shadow:0 6px 16px rgba(229,36,43,.45)}.bigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.bc{position:relative}.bc .cover{height:230px}.bc .tx{padding:18px 22px 22px}.bc h3{margin:10px 0 8px;font-size:23px;line-height:1.2;letter-spacing:-.02em}.bc p{margin:0 0 10px;color:var(--muted)}.day{margin:30px 0 14px;font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.hero1{margin:22px 0}.hero1 .big{min-height:480px}
.sec{display:flex;align-items:center;gap:12px;margin:34px 0 14px}.sec h2{margin:0;font-size:24px;letter-spacing:-.02em}.sec i{flex:1;height:2px;background:linear-gradient(90deg,var(--red),transparent);border-radius:2px}
.layout{display:grid;grid-template-columns:1fr 330px;gap:22px}@media (max-width:980px){.layout{grid-template-columns:1fr}}
.list{display:grid;gap:14px}.row{display:grid;grid-template-columns:220px 1fr;gap:0}@media (max-width:640px){.row{grid-template-columns:1fr}.row .cover{height:150px}}
.row .cover{min-height:150px}.row .tx{padding:16px 20px}.row h3{margin:8px 0 6px;font-size:20px;line-height:1.25;letter-spacing:-.01em}.row p{margin:0 0 8px;color:var(--muted);font-size:14.5px}
.box{padding:20px;margin-bottom:18px}.box h3{margin:0 0 12px;font-size:18px}
.top5 a{display:flex;gap:14px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--rim)}.top5 a:last-child{border:0}.top5 b{flex:none;width:30px;font-size:26px;line-height:1;font-weight:800;background:linear-gradient(180deg,var(--red),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}.top5 span{font-weight:650;line-height:1.35;font-size:15px}
.eco a{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--field);margin-bottom:8px;font-weight:650;font-size:14.5px;transition:transform .2s}.eco a:hover{transform:translateX(4px)}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}
.art{max-width:780px;margin:24px auto}.art .cover{height:min(46vw,340px);border-radius:28px;margin-bottom:22px}.art .cover svg{width:auto;height:92%;right:4%;bottom:-8%}
.art h1{font-size:clamp(30px,5vw,48px);line-height:1.08;letter-spacing:-.03em;margin:12px 0}.art .lead{font-size:20px;color:var(--muted);line-height:1.5;margin:0 0 18px}
.art .by{display:flex;gap:12px;align-items:center;padding:14px 0;border-top:1px solid var(--rim);border-bottom:1px solid var(--rim);margin-bottom:24px}.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--red));color:#fff;display:grid;place-items:center;font-weight:800}
.body p{font-size:18px;line-height:1.75;margin:0 0 18px}.body h2{font-size:26px;margin:30px 0 10px;letter-spacing:-.02em}.body blockquote{margin:24px 0;padding:18px 22px;border-left:4px solid var(--red);background:var(--field);border-radius:0 18px 18px 0;font-size:20px;font-weight:650;line-height:1.45}
.body ul{padding-left:22px;font-size:18px;line-height:1.7;margin:0 0 18px}
.share{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}.btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;border:0;background:var(--field);font-weight:650;font-size:14px;box-shadow:inset 0 1px 0 var(--rim);transition:transform .2s}.btn:hover{transform:translateY(-2px)}.btn.p{background:linear-gradient(180deg,#2d8ff0,#0a68c9);color:#fff}
.back{display:inline-flex;margin-top:18px;color:var(--accent);font-weight:650}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.grid3 .cover{height:140px}.grid3 .tx{padding:14px 16px 18px}.grid3 h3{margin:8px 0 4px;font-size:17px;line-height:1.28}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s var(--d,0ms),transform .6s var(--d,0ms)}.reveal.in{opacity:1;transform:none}
footer{margin-top:50px;background:#0a1f44;color:#b8cdf2;padding:34px 0;font-size:14px}footer .wrap{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;align-items:center}footer a{color:#fff;font-weight:650}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

{id:'work-docs-tablica-do-nauki',cat:'tech',t:'2026-10-12T09:00',views:1400,frame:'https://orangedocs.vercel.app',link:'https://orangedocs.vercel.app',linkText:'Otwórz Work Docs',title:'Work Docs: nowa tablica do nauki i rysowania schematów w pomarańczowym stylu',lead:'Nowa aplikacja MGS działa w przeglądarce na komputerze i telefonie, bez logowania i instalacji – a tablice zapisują się same w Twojej przeglądarce.',author:'Dział technologii',body:['Work Docs to tablica do nauki i rysowania schematów w pomarańczowym stylu, z logo MGS i stopką „© MGS Corporation 2026”. Aplikacja jest dostępna pod adresem orangedocs.vercel.app.','## Rysowanie i porządkowanie','- pisak, gumka, kształty, strzałki, tekst i karteczki w stylu odręcznym z pomarańczową obwódką,','- strzałki przyklejają się do kształtów i podążają za nimi – w trzech stylach: prosta, łuk i łamana,','- plusy przy zaznaczonym kształcie „odciągają gałązkę”: klik dodaje nowy element, a przeciągnięcie wyciąga go tam, gdzie puścisz,','- wiele tablic w zakładkach, cofanie i ponawianie, siatka, zoom i wyrównywanie.','## Wykresy, tabele i obrazy','- wykresy słupkowy, liniowy, warstwowy, kołowy i pierścieniowy z edytorem danych i wklejaniem z Excela,','- edytowalne tabele – komórki edytujesz bezpośrednio na tablicy,','- obrazy z pliku, wklejone albo przeciągnięte.','## Nauka','- kalkulator naukowy (klawisz C): trygonometria, logarytmy, potęgi i silnia,','- matematyka: trójkąty i inne figury, wzory i równania (ułamki, pierwiastki, sumy, całki), wykresy funkcji,','- fiszki w formacie „pytanie :: odpowiedź”, timer Pomodoro i tryb prezentacji na pełny ekran,','- szablony: schemat blokowy, mapa myśli, oś czasu, „za i przeciw”, diagram Venna i drzewo.','## Asystent AI','Pod skrótem Ctrl+J (lub prawym przyciskiem → „Zapytaj AI”) można po polsku poprosić o gotowy element, np. „Zrób mapę myśli o fotosyntezie”. AI buduje mapy, schematy, wykresy, tabele, fiszki i wzory, a odpowiedź cofa się jednym Ctrl+Z. Dostęp do asystenta jest chroniony kodem dostępu, a klucz Anthropic pozostaje po stronie serwera.','> Eksport w PNG, SVG, PDF (A4 poziomo, z logo i stopką) oraz plik JSON do kopii zapasowej.']},
{id:'10-pazdziernika-start-medicov-wizytowka-wiadomosci',cat:'corp',t:'2026-10-10T10:00',views:1200,title:'10 października: MGS Corporation uruchamia Medicov MGS, stronę wizytówkę i MGS Wiadomości',lead:'Trzy nowe serwisy w jeden dzień – portal medyczny Medicov MGS, firmowa strona wizytówka oraz portal informacyjny MGS Wiadomości.',author:'Redakcja MGS',body:['10 października 2026 roku MGS Corporation wypuściła trzy nowe strony internetowe, które otwierają kolejny etap rozwoju ekosystemu MGS.','## Co zostało uruchomione','- **Medicov MGS** – serwis centrum medycznego dla pacjentów i personelu: rezerwacje wizyt online, wiadomości z lekarzem oraz dokumentacja i recepty do wydruku,','- **strona wizytówka MGS Corporation** – prezentuje 16 marek grupy, system tożsamości MGS Identity oraz dane kontaktowe, w wersji polskiej i angielskiej,','- **MGS Wiadomości** – portal informacyjny, w którym będziemy publikować najnowsze informacje z całego ekosystemu.','> Wszystkie trzy serwisy łączy wspólny styl Liquid Glass i idea jednej tożsamości klienta w całym ekosystemie.','## Dalsze plany','Kolejne marki grupy będą dołączać do ekosystemu w następnych tygodniach. O każdej nowości poinformujemy w MGS Wiadomościach.']},
{id:'medicov-wiadomosci-z-lekarzem',cat:'health',t:'2026-10-09T18:00',views:870,title:'Medicov MGS: wiadomości z lekarzem, rezerwacje online i recepty do wydruku',lead:'Portal pacjenta pozwala napisać do lekarza, umówić wizytę i obejrzeć dokumentację – wszystko w jednym miejscu.',author:'Redakcja MGS',body:['Medicov MGS rozbudowuje portal pacjenta. Po założeniu konta i zatwierdzeniu przez administratora pacjent może umówić i odwołać wizytę, zobaczyć swoje wizyty i zatwierdzone przez lekarza zalecenia, a także wysłać wiadomość do wybranego lekarza lub do rejestracji.','## Bezpieczeństwo przede wszystkim','Wiadomości widzą wyłącznie uczestnicy rozmowy. Jeśli lekarz jest niedostępny, administrator może odpisać w jego imieniu – pacjent zobaczy wtedy wyraźny dopisek „przez administrację”.','- wiadomości nie służą do pilnych spraw – w nagłym przypadku należy dzwonić pod numer 112,','- recepty drukowane z systemu mają charakter informacyjny; podstawą realizacji jest e-recepta,','- asystent AI tylko podpowiada, a decyzję zawsze podejmuje lekarz.']},
{id:'mgs-identity-card-iii',cat:'corp',t:'2026-10-09T12:00',views:760,title:'MGS Identity Card III: jedna karta do wszystkich usług ekosystemu',lead:'CSO Card, MGS Identity Card III i opcjonalna MGS Card – wyjaśniamy, czym się różnią i jak je uzyskać.',author:'Redakcja MGS',body:['Aby korzystać z usług MGS, potrzebne są karty wydawane w punktach obsługi klienta.','## Trzy karty','- **CSO Card** – podstawowa karta klienta, daje dostęp do usług,','- **MGS Identity Card III** – zaawansowana identyfikacja i integracja między systemami,','- **MGS Card** – opcjonalna, z rozszerzonymi funkcjami, m.in. płatnościami i dostępem premium.','Karty można uzyskać w CSO Office lub MGS Office. Wymagana jest akceptacja regulaminu.']},
{id:'dba-bank-i-mgs-bank',cat:'fin',t:'2026-10-08T15:00',views:640,title:'DBA Bank i MGS Bank: jak działa finansowy rdzeń ekosystemu',lead:'Jeden bank odpowiada za konta i operacje klientów, drugi za infrastrukturę transakcyjną i systemy międzybankowe.',author:'Dział finansów',body:['DBA Bank to nowoczesny bank oparty na systemach bazodanowych: obsługuje konta, operacje finansowe i integrację z systemami MGS.','MGS Bank stanowi rdzeń infrastruktury finansowej – przetwarza transakcje, obsługuje systemy międzybankowe i pracuje w trybie wysokiej dostępności.','> Obie marki są ściśle zależne od wydajnych i bezpiecznych baz danych.','Dzięki integracji klienci rozliczają zakupy w MGS Shop bezpośrednio przez DBA Bank.']},
{id:'paybud-i-mgs-payments',cat:'fin',t:'2026-10-07T11:00',views:520,title:'MGS Payments i PayBud: płatności w ekosystemie i rozliczenia między ludźmi',lead:'Dwie marki płatnicze rozszerzają ofertę – jedna dla ekosystemu, druga dla rozliczeń między osobami.',author:'Dział finansów',body:['MGS Payments obsługuje płatności w całym ekosystemie, a PayBud wspiera rozliczenia i płatności między osobami.','Obie usługi działają jako samodzielne serwisy, a w połączeniu z MGS Identity pozwalają zarządzać finansami przy użyciu jednej tożsamości.']},
{id:'mgs-shop-platnosci-dba',cat:'retail',t:'2026-10-06T10:00',views:430,title:'MGS Shop: sprzedaż produktów i usług z płatnościami przez DBA Bank',lead:'Platforma handlowa ekosystemu integruje się z płatnościami i obsługą klientów MGS.',author:'Dział handlu',body:['MGS Shop to platforma sprzedaży produktów i usług. Płatności realizowane są przez DBA Bank, a obsługę klientów zapewnia CSO.','Zamówienia mogą być dostarczane przez Głę Głę Post, co domyka pełny łańcuch: zakup, płatność i dostawa w jednym ekosystemie.']},
{id:'glegle-post-cso-post',cat:'log',t:'2026-10-05T14:00',views:390,title:'Głę Głę Post i CSO Post: dostawy i dokumenty w jednym systemie',lead:'System logistyczno-pocztowy ekosystemu obsługuje przesyłki, dokumenty i integrację z punktami CSO.',author:'Dział logistyki',body:['Głę Głę Post odpowiada za dostawy i dokumenty, a CSO Post integruje przesyłki z punktami obsługi klienta.','Dla klientów MGS Shop oznacza to jednolite śledzenie zamówień i odbiór w znanych punktach.']},
{id:'ekaf-corporation-zaplecze',cat:'tech',t:'2026-10-04T09:00',views:610,title:'Ekaf Corporation: technologiczne zaplecze całej grupy MGS',lead:'Rozwój AI i systemów IT oraz narzędzia – od Goodle po DBA Assistant by MGS.',author:'Dział technologii',body:['Ekaf Corporation jest głównym dostawcą technologii dla ekosystemu. Rozwija sztuczną inteligencję i systemy IT.','Do jej produktów należą m.in. Goodle (kalkulator, zegarek) oraz DBA Assistant by MGS.','> Technologia ma być niewidoczna dla użytkownika – po prostu działać.']},
{id:'wykresy-nowa-aplikacja',cat:'tech',t:'2026-10-03T16:00',views:480,title:'Wykresy: aplikacja do tworzenia wykresów z przeciąganiem punktów',lead:'Kołowe, liniowe, słupkowe i inne – dane zmienia się palcem, a wykres reaguje na żywo.',author:'Dział technologii',body:['Nowa aplikacja Wykresy pozwala tworzyć wykresy różnych typów i edytować dane przez przeciąganie punktów, także na telefonie.','Interfejs w stylu Liquid Glass działa w przeglądarce i można dodać go do ekranu głównego jak zwykłą aplikację.']},
{id:'chatbot-mgs',cat:'tech',t:'2026-10-02T13:00',views:350,title:'Chatbot MGS: oficjalny asystent AI ekosystemu',lead:'Wsparcie użytkowników, integracja z systemami MGS i automatyzacja obsługi.',author:'Dział technologii',body:['Chatbot MGS to oficjalny asystent AI, który odpowiada na pytania użytkowników, współpracuje z systemami MGS i automatyzuje obsługę klienta.']},
{id:'mgs-work',cat:'work',t:'2026-10-01T10:00',views:300,title:'MGS Work: praca i rekrutacja w ekosystemie MGS',lead:'Oferty pracy i rekrutacja w jednym miejscu – z logowaniem przez MGS Identity.',author:'Dział HR',body:['MGS Work zbiera oferty pracy i obsługuje rekrutację w ekosystemie MGS. Kandydaci logują się tą samą tożsamością, z której korzystają w innych usługach.']},
{id:'projekty-wstrzymane',cat:'corp',t:'2026-09-30T12:00',views:240,title:'Wstrzymane projekty: MGS messages i Page Crafter',lead:'Dwie marki zostały zatrzymane i nie będą działać do odwołania.',author:'Redakcja MGS',body:['MGS messages (komunikator) oraz Page Crafter (narzędzie do tworzenia stron) zostały wstrzymane na czas nieokreślony.','O ewentualnym wznowieniu poinformujemy w MGS Wiadomościach.']}
];
const ECO=[['Medicov MGS','https://medicov.vercel.app'],['MGS Shop','https://mgs-shop.vercel.app'],['MGS Payments','https://mgs-payments.vercel.app'],['PayBud','https://paybud.site'],['MGS Work','https://mgs-work.vercel.app'],['MGS Identity','https://mgsid.vercel.app'],['Wykresy','https://wykresy-eight.vercel.app'],['Work Docs','https://orangedocs.vercel.app']];
/* ===== KONIEC TREŚCI ===== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=d=>new Date(d).toLocaleDateString('pl-PL',{day:'numeric',month:'long',year:'numeric'});
const rel=d=>{const m=(Date.now()-new Date(d))/60000;return m<60?Math.max(1,Math.round(m))+' min temu':m<1440?Math.round(m/60)+' godz. temu':m<10080?Math.round(m/1440)+' dn. temu':fd(d)};
const mins=a=>Math.max(1,Math.round(a.body.join(' ').split(/\s+/).length/190));
const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const A=[...ARTICLES].sort((a,b)=>new Date(b.t)-new Date(a.t));
const cover=(a,cls='')=>{const c=CATS[a.cat];if(a.frame)return `<div class="cover frame ${cls}" style="--c1:#ffe8cf;--c2:#ffb877"><iframe src="${a.frame}" loading="lazy" tabindex="-1" title="${esc(a.title)}" sandbox="allow-scripts allow-same-origin"></iframe></div>`;return `<div class="cover ${cls}" style="--c1:${c[2]};--c2:${c[3]}"><svg viewBox="0 0 100 100">${ICO[a.cat]}</svg></div>`};
const pill=a=>`<span class="pill" style="--c:${CATS[a.cat][1]}">${CATS[a.cat][0]}</span>`;
let Q='';
function nav(cat,najn){$('#cats').innerHTML=`<a href="#/" class="${!cat&&!najn?'on':''}">Wszystko</a><a href="#/najnowsze" class="${najn?'on':''}">Najnowsze</a>`+Object.entries(CATS).map(([k,v])=>`<a href="#/k/${k}" class="${cat===k?'on':''}">${v[0]}</a>`).join('')}
function side(){return `<aside><div class="glass box"><h3>Najczęściej czytane</h3><div class="top5">${[...A].sort((a,b)=>b.views-a.views).slice(0,5).map((a,i)=>`<a href="#/a/${a.id}"><b>${i+1}</b><span>${esc(a.title)}</span></a>`).join('')}</div></div>
 <div class="glass box eco"><h3>Ekosystem MGS</h3>${ECO.map(e=>`<a href="${e[1]}" target="_blank" rel="noopener">${esc(e[0])}<span>↗</span></a>`).join('')}</div></aside>`}
const isNew=a=>(new Date(A[0].t)-new Date(a.t))<2*D;
function bigCard(a,i){return `<a class="card bc reveal" style="--d:${(i%3)*80}ms" href="#/a/${a.id}">${isNew(a)?'<span class="new">NOWE</span>':''}${cover(a)}<div class="tx">${pill(a)}<h3>${esc(a.title)}</h3><p>${esc(a.lead)}</p><div class="meta">${fd(a.t)} · ${esc(a.author)} · ${mins(a)} min czytania</div></div></a>`}
function latest(){let h='',last='';A.forEach((a,i)=>{const d=fd(a.t);if(d!==last){if(last)h+='</div>';h+=`<div class="day">${d}</div><div class="bigs">`;last=d}h+=bigCard(a,i)});return `<div class="sec"><h2>Najnowsze informacje</h2><i></i></div>${h}</div>`}
function rowCard(a,i){return `<a class="card row reveal" style="--d:${(i%4)*60}ms" href="#/a/${a.id}">${cover(a)}<div class="tx">${pill(a)}<h3>${esc(a.title)}</h3><p>${esc(a.lead)}</p><div class="meta">${rel(a.t)} · ${mins(a)} min czytania</div></div></a>`}
function home(cat){
  let list=A.filter(a=>(!cat||a.cat===cat)&&(!Q||(a.title+' '+a.lead+' '+a.body.join(' ')).toLowerCase().includes(Q)));
  if(!list.length)return `<div class="empty glass" style="margin:24px 0;padding:60px 16px">Brak wiadomości${Q?' dla „'+esc(Q)+'”':''}.</div>`;
  const full=!cat&&!Q&&list.length>=5,top=list[0];
  const hero=full?`<div class="hero1"><a class="big card reveal" href="#/a/${top.id}">${cover(top)}<span class="tagnew">NAJNOWSZE · ${fd(top.t)}</span>${pill(top)}<h1>${esc(top.title)}</h1><p>${esc(top.lead)}</p><div class="meta">${esc(top.author)} · ${mins(top)} min czytania</div></a></div>
   <div class="sec"><h2>Najnowsze</h2><i></i><a class="all" href="#/najnowsze">Zobacz wszystkie →</a></div><div class="bigs">${list.slice(1,4).map(bigCard).join('')}</div>`:'';
  const rest=full?list.slice(4):list;
  return `${hero}<div class="layout"><div><div class="sec"><h2>${cat?CATS[cat][0]:Q?'Wyniki wyszukiwania':'Pozostałe wiadomości'}</h2><i></i></div><div class="list">${rest.map(rowCard).join('')||''}</div></div>${side()}</div>`}
function article(id){
  const a=A.find(x=>x.id===id);if(!a)return `<div class="empty">Nie znaleziono artykułu. <a class="back" href="#/">← Wróć</a></div>`;
  const rel2=A.filter(x=>x.id!==id&&x.cat===a.cat).concat(A.filter(x=>x.cat!==a.cat)).slice(0,3);
  const body=a.body.map(p=>p.startsWith('## ')?`<h2>${inl(p.slice(3))}</h2>`:p.startsWith('> ')?`<blockquote>${inl(p.slice(2))}</blockquote>`:p.startsWith('- ')?'\0'+p:`<p>${inl(p)}</p>`).join('').replace(/(\0- [^\0<]*)+/g,m=>'<ul>'+m.split('\0- ').filter(Boolean).map(x=>`<li>${inl(x)}</li>`).join('')+'</ul>');
  return `<article class="art"><a class="back" href="#/">← Wszystkie wiadomości</a>${cover(a)}${pill(a)}<h1>${esc(a.title)}</h1><p class="lead">${esc(a.lead)}</p>
   <div class="by"><span class="av">${esc(a.author[0])}</span><div><b>${esc(a.author)}</b><div class="meta">${fd(a.t)} · ${mins(a)} min czytania</div></div></div>
   <div class="body">${body}</div><div class="share">${a.link?`<a class="btn p" href="${a.link}" target="_blank" rel="noopener">${esc(a.linkText||'Otwórz')} ↗</a>`:''}<button class="btn${a.link?'':' p'}" id="shr">Udostępnij</button><button class="btn" id="cpl">Kopiuj link</button></div></article>
   <div class="sec"><h2>Czytaj także</h2><i></i></div><div class="grid3">${rel2.map(x=>`<a class="card reveal" href="#/a/${x.id}">${cover(x)}<div class="tx">${pill(x)}<h3>${esc(x.title)}</h3><div class="meta">${rel(x.t)}</div></div></a>`).join('')}</div>`}
function route(){
  const [, p='',id]=(location.hash||'#/').split('/');const m=$('#main');
  const cat=p==='k'&&CATS[id]?id:'',najn=p==='najnowsze';nav(p==='a'?A.find(x=>x.id===id)?.cat:cat,najn);
  m.innerHTML=p==='a'?article(id):najn?latest():home(cat);document.title=(najn?'Najnowsze – ':p==='a'&&A.find(x=>x.id===id)?A.find(x=>x.id===id).title+' – ':cat?CATS[cat][0]+' – ':'')+'MGS Wiadomości';
  scrollTo(0,0);watch();requestAnimationFrame(fitFrames);setTimeout(fitFrames,300);
  const s=$('#shr');if(s){const u=location.href,t=document.title;s.onclick=()=>{if(navigator.share)navigator.share({title:t,url:u}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(u);s.textContent='Skopiowano ✓'}};$('#cpl').onclick=e=>{navigator.clipboard&&navigator.clipboard.writeText(u).catch(()=>{});e.target.textContent='Skopiowano ✓'}}
}
function fitFrames(){$$('.cover.frame').forEach(c=>{const f=c.querySelector('iframe'),w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;f.style.width='1280px';f.style.height=Math.round(h*1280/w)+'px';f.style.transform='scale('+(w/1280)+')'})}
addEventListener('resize',fitFrames);
function watch(){const els=$$('.reveal');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});els.forEach(e=>io.observe(e))}
$('#tick').innerHTML=A.slice(0,6).map(a=>`<a href="#/a/${a.id}">${esc(a.title)}</a>`).join('');
$('#today').textContent=new Date().toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});$('#yr').textContent=new Date().getFullYear();
$('#sb').onclick=()=>{$('#sr').classList.toggle('on');if($('#sr').classList.contains('on'))$('#q').focus()};
$('#q').oninput=e=>{Q=e.target.value.trim().toLowerCase();if(location.hash.startsWith('#/a/')){location.hash='#/'}else route()};
$('#tb').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark'};
addEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.transform=`scaleX(${Math.min(1,scrollY/Math.max(1,h.scrollHeight-innerHeight))})`},{passive:true});
addEventListener('hashchange',route);route();
</script>
</body>
</html>
